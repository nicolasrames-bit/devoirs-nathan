<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f6f1e7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="🎒">
<title>🎒</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎒</text></svg>">
<style>
  :root{
    --bg:#f6f1e7; --card:#fffdf8; --ink:#1f2a37; --muted:#6b7280; --line:#e7dfcf; --soft:#efe8da;
    --accent:#1d4ed8; --today:#c2410c; --ok:#15803d; --bad:#b91c1c; --radius:16px;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#111418; --card:#1a1f26; --ink:#e8eaed; --muted:#9aa3ad; --line:#2a313a; --soft:#222932;
           --accent:#7aa2ff; --today:#fb923c; --ok:#4ade80; --bad:#f87171; }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Hebrew",Arial,sans-serif}
  button,select{font:inherit;color:inherit}
  .wrap{max-width:680px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 16px calc(96px + env(safe-area-inset-bottom))}
  header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:8px 0 16px}
  .tools{display:flex;gap:8px;align-items:center}
  h1{font-size:28px;line-height:1.1;margin:0;letter-spacing:-.02em}
  .sub{color:var(--muted);font-size:13px;margin-top:6px}
  .btn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-size:14px;cursor:pointer}
  .lang{appearance:none;-webkit-appearance:none;border:1px solid var(--line);background:var(--card);border-radius:999px;
    padding:8px 12px;font-size:14px;cursor:pointer;text-align:center}
  .btn:active,.chip:active,.daybtn:active{transform:scale(.97)}
  section{margin-top:24px}
  h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 10px;font-weight:600;
     display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  [dir=rtl] h2{letter-spacing:0}
  h2.today{color:var(--today)}
  h2 a{text-transform:none;letter-spacing:0;font-weight:500;color:var(--accent);text-decoration:none;cursor:pointer;white-space:nowrap}
  .day{font-weight:600;font-size:15px;margin:14px 0 8px}
  .hero{font-size:22px;font-weight:700;letter-spacing:-.01em}
  .empty{background:var(--card);border:1px dashed var(--line);border-radius:var(--radius);padding:22px;text-align:center;color:var(--muted)}

  /* cartes devoirs */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;padding-inline-start:16px;
    margin-bottom:10px;display:flex;gap:12px;align-items:flex-start;position:relative;overflow:hidden}
  .card::before{content:"";position:absolute;top:0;bottom:0;inset-inline-start:0;width:5px;background:var(--c,#999)}
  .card .body{flex:1;min-width:0}
  .subj{font-weight:700;font-size:15px}
  .content{white-space:pre-wrap;word-wrap:break-word;margin-top:4px}
  .teacher{color:var(--muted);font-size:13px;margin-top:6px}
  .when{color:var(--muted);font-size:12px;font-weight:600;margin-bottom:2px}
  .check{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:transparent;cursor:pointer;
    display:grid;place-items:center;color:transparent;font-size:16px;margin-top:2px;padding:0}
  .card.done{opacity:.55}
  .card.done .content{text-decoration:line-through}
  .card.done .check{background:var(--ok);border-color:var(--ok);color:#fff}

  /* emploi du temps */
  .tt{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  .lesson{display:flex;gap:12px;align-items:center;padding:11px 14px;border-top:1px solid var(--line);position:relative}
  .lesson:first-child{border-top:0}
  .lesson .h{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-weight:700;font-size:14px;
    background:color-mix(in srgb, var(--c) 18%, transparent);color:var(--c)}
  .lesson .lb{flex:1;min-width:0}
  .lesson .ls{font-weight:600}
  .lesson .lm{color:var(--muted);font-size:13px}
  .lesson .ln{font-size:13px;color:var(--today);margin-top:2px}
  .lesson.now{background:color-mix(in srgb, var(--accent) 9%, transparent)}
  .lesson .nowtag{position:absolute;inset-inline-end:12px;top:10px;font-size:11px;font-weight:700;color:var(--accent)}
  .lesson.cancel .ls{text-decoration:line-through;color:var(--muted)}
  .badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--bad);color:#fff;margin-inline-start:6px;vertical-align:2px;text-decoration:none}
  .bag{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
  .bag span{background:var(--soft);border-radius:999px;padding:4px 10px;font-size:13px}

  .seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;margin-bottom:12px}
  .seg button{flex:1;border:0;background:transparent;padding:8px;border-radius:9px;font-size:14px;cursor:pointer;color:var(--muted)}
  .seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
  .days{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:16px}
  .daybtn{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:8px 0;cursor:pointer;text-align:center;position:relative}
  .daybtn b{display:block;font-size:18px}
  .daybtn small{font-size:12px;color:var(--muted)}
  .daybtn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
  .daybtn[aria-pressed="true"] small{color:inherit;opacity:.8}
  .daybtn.is-today::after{content:"";position:absolute;bottom:4px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--today)}

  .chips{display:flex;gap:8px;overflow-x:auto;padding:0 16px 6px;margin:0 -16px 6px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer}
  .chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  details summary{cursor:pointer;color:var(--muted);font-size:14px;margin-top:26px}

  /* barre d'onglets */
  nav{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb, var(--card) 92%, transparent);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);
    padding:6px 8px calc(6px + env(safe-area-inset-bottom));display:flex;justify-content:center}
  nav .in{display:flex;max-width:520px;width:100%}
  nav button{position:relative;flex:1;border:0;background:transparent;padding:6px 4px;cursor:pointer;color:var(--muted);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
  nav button span{font-size:22px;line-height:1.1}
  nav button[aria-current="page"]{color:var(--accent);font-weight:600}
  .count{position:absolute;top:2px;inset-inline-start:calc(50% + 8px);background:var(--today);color:#fff;border-radius:999px;font-size:10px;line-height:16px;min-width:16px;padding:0 4px;font-weight:700;font-style:normal}

  /* écran mot de passe */
  .lock{min-height:80vh;display:grid;place-items:center}
  .lock form{width:100%;max-width:340px;text-align:center}
  .lock .emoji{font-size:56px}
  .lock input{width:100%;font:inherit;font-size:17px;padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);margin:16px 0 10px}
  .lock button{width:100%;padding:14px;border-radius:12px;border:0;background:var(--accent);color:#fff;font-weight:600;font-size:16px;cursor:pointer}
  .lock .lang{margin-top:22px}
  .err{color:#dc2626;font-size:14px;min-height:20px;margin-top:8px}
  .warn{background:color-mix(in srgb, var(--today) 14%, var(--card));border:1px solid color-mix(in srgb, var(--today) 40%, transparent);
    border-radius:12px;padding:10px 14px;font-size:14px;margin:0 0 14px}
  /* exercices */
  .set{display:flex;align-items:center;gap:12px;cursor:pointer;width:100%;text-align:start;font:inherit;color:inherit}
  .set .ico{flex:none;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:20px;
    background:color-mix(in srgb, var(--c) 16%, transparent)}
  .set .meta{color:var(--muted);font-size:13px}
  .set .res{flex:none;font-size:13px;font-weight:700;color:var(--ok)}
  .player .top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .bar{flex:1;height:8px;background:var(--soft);border-radius:999px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .3s}
  .qcard{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px}
  .qnum{color:var(--muted);font-size:13px;font-weight:600;margin-bottom:6px}
  .q{font-size:21px;font-weight:700;line-height:1.35;margin-bottom:16px;white-space:pre-wrap}
  .opts{display:grid;gap:10px}
  .opt{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:14px 16px;font-size:18px;cursor:pointer;text-align:start}
  .opt.good{border-color:var(--ok);background:color-mix(in srgb, var(--ok) 14%, var(--card))}
  .opt.bad{border-color:var(--bad);background:color-mix(in srgb, var(--bad) 12%, var(--card))}
  .opt:disabled{cursor:default}
  .ans{width:100%;font:inherit;font-size:20px;padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
  .act{display:flex;gap:10px;margin-top:14px}
  .primary{flex:1;border:0;background:var(--accent);color:#fff;border-radius:14px;padding:14px;font-size:17px;font-weight:700;cursor:pointer}
  .ghost{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:14px 16px;font-size:15px;cursor:pointer}
  .fb{margin-top:14px;border-radius:14px;padding:12px 14px;font-size:15px}
  .fb.good{background:color-mix(in srgb, var(--ok) 14%, var(--card));border:1px solid color-mix(in srgb, var(--ok) 40%, transparent)}
  .fb.bad{background:color-mix(in srgb, var(--bad) 10%, var(--card));border:1px solid color-mix(in srgb, var(--bad) 35%, transparent)}
  .fb b{display:block;margin-bottom:2px}
  .hintbox{margin-top:12px;color:var(--muted);font-size:15px}
  .learn details{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;padding:0 14px}
  .learn summary{cursor:pointer;padding:12px 0;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:10px;margin:0;color:var(--ink);font-size:15px}
  .learn summary::-webkit-details-marker{display:none}
  .learn ul{margin:0 0 12px;padding-inline-start:18px}
  .learn li{margin:3px 0}
  .learn li small{color:var(--muted)}
  .end{text-align:center;padding:26px 10px}
  .end .stars{font-size:46px;letter-spacing:4px}
  .end .big{font-size:24px;font-weight:800;margin:8px 0 4px}
  .hidden{display:none !important}
</style>
</head>
<body>
<div class="wrap">
  <div id="lock" class="lock">
    <form id="lockForm" autocomplete="on">
      <div class="emoji">🎒</div>
      <h1 style="margin-top:8px" data-t="school"></h1>
      <div class="sub" data-t="portal"></div>
      <input id="pw" type="password" autocomplete="current-password" required>
      <button type="submit" data-t="open"></button>
      <div id="err" class="err"></div>
      <select class="lang" aria-label="Language"></select>
    </form>
  </div>

  <div id="app" class="hidden">
    <header>
      <div>
        <h1 id="title"></h1>
        <div class="sub" id="updated"></div>
      </div>
      <div class="tools">
        <select class="lang" aria-label="Language"></select>
        <button class="btn" id="reload">↻</button>
      </div>
    </header>
    <main id="view"></main>
  </div>
</div>

<nav id="nav" class="hidden">
  <div class="in">
    <button data-tab="home"><span>🏠</span><b data-t="navHome" style="font-weight:inherit"></b></button>
    <button data-tab="tt"><span>🗓️</span><b data-t="navTT" style="font-weight:inherit"></b></button>
    <button data-tab="hw"><span>📚</span><b data-t="navHW" style="font-weight:inherit"></b><i id="hwCount"></i></button>
    <button data-tab="ex"><span>🧠</span><b data-t="navEx" style="font-weight:inherit"></b></button>
  </div>
</nav>

<script>
(() => {
  // ---------- langues ----------
  const LANGS = {
    he: {label:"עברית", locale:"he-IL", dir:"rtl"},
    fr: {label:"Français", locale:"fr-FR", dir:"ltr"},
    en: {label:"English", locale:"en-GB", dir:"ltr"},
    es: {label:"Español", locale:"es-ES", dir:"ltr"},
  };
  const T = {
    school:      {fr:"École", he:"בית ספר", en:"School", es:"Escuela"},
    portal:      {fr:"Portail privé de la famille", he:"פורטל משפחתי פרטי", en:"Private family portal", es:"Portal privado de la familia"},
    password:    {fr:"Mot de passe famille", he:"סיסמת המשפחה", en:"Family password", es:"Contraseña familiar"},
    open:        {fr:"Ouvrir", he:"כניסה", en:"Open", es:"Entrar"},
    wrongPw:     {fr:"Mot de passe incorrect.", he:"סיסמה שגויה.", en:"Wrong password.", es:"Contraseña incorrecta."},
    noData:      {fr:"Données introuvables pour l'instant.", he:"אין נתונים כרגע.", en:"No data yet.", es:"Todavía no hay datos."},
    updated:     {fr:"Mis à jour", he:"עודכן", en:"Updated", es:"Actualizado"},
    reload:      {fr:"Recharger", he:"רענון", en:"Reload", es:"Recargar"},
    navHome:     {fr:"Aujourd'hui", he:"היום", en:"Today", es:"Hoy"},
    navTT:       {fr:"Horaire", he:"מערכת שעות", en:"Timetable", es:"Horario"},
    navHW:       {fr:"Devoirs", he:"שיעורי בית", en:"Homework", es:"Deberes"},
    today:       {fr:"Aujourd'hui", he:"היום", en:"Today", es:"Hoy"},
    tomorrow:    {fr:"Demain", he:"מחר", en:"Tomorrow", es:"Mañana"},
    thisWeek:    {fr:"Cette semaine", he:"השבוע", en:"This week", es:"Esta semana"},
    nextWeek:    {fr:"Semaine prochaine", he:"שבוע הבא", en:"Next week", es:"Próxima semana"},
    later:       {fr:"Plus tard", he:"בהמשך", en:"Later", es:"Más adelante"},
    noSchool:    {fr:"Pas d'école aujourd'hui 🎉", he:"אין לימודים היום 🎉", en:"No school today 🎉", es:"Hoy no hay clase 🎉"},
    details:     {fr:"Détail →", he:"← פרטים", en:"Details →", es:"Detalle →"},
    hwTodo:      {fr:"Devoirs à faire", he:"שיעורי בית להכין", en:"Homework to do", es:"Deberes pendientes"},
    seeAll:      {fr:"Tout voir →", he:"← הכל", en:"See all →", es:"Ver todo →"},
    nothingToDo: {fr:"🎉 Rien à faire pour l'instant", he:"🎉 אין מה להכין כרגע", en:"🎉 Nothing to do right now", es:"🎉 Nada pendiente por ahora"},
    noTT:        {fr:"L'emploi du temps n'est pas encore disponible.", he:"מערכת השעות עדיין לא זמינה.", en:"The timetable isn't available yet.", es:"El horario aún no está disponible."},
    noLessons:   {fr:"Pas de cours ce jour-là", he:"אין שיעורים ביום הזה", en:"No lessons that day", es:"No hay clases ese día"},
    hwOfDay:     {fr:"Devoirs de ce jour", he:"שיעורי בית ליום הזה", en:"Homework for this day", es:"Deberes de este día"},
    now:         {fr:"en cours", he:"עכשיו", en:"now", es:"ahora"},
    cancelled:   {fr:"Annulé", he:"בוטל", en:"Cancelled", es:"Cancelada"},
    all:         {fr:"Tout", he:"הכל", en:"All", es:"Todo"},
    noneUpcoming:{fr:"🎉 Aucun devoir à venir", he:"🎉 אין שיעורי בית בקרוב", en:"🎉 No upcoming homework", es:"🎉 No hay deberes próximos"},
    previous:    {fr:"Jours précédents", he:"ימים קודמים", en:"Previous days", es:"Días anteriores"},
    bag:         {fr:"Dans le cartable", he:"בתיק", en:"In the school bag", es:"En la mochila"},
    expired:     {fr:"⚠️ La connexion à Webtop a expiré : les infos ne sont plus mises à jour. Un parent doit se reconnecter.", he:"⚠️ החיבור ל-Webtop פג: המידע לא מתעדכן. הורה צריך להתחבר מחדש.", en:"⚠️ The Webtop session expired: info is no longer updating. A parent needs to sign in again.", es:"⚠️ La sesión de Webtop caducó: la información ya no se actualiza. Un padre debe volver a conectarse."},
    navEx:       {fr:"Exercices", he:"תרגול", en:"Practice", es:"Ejercicios"},
    exTitle:     {fr:"S'entraîner sur les derniers cours", he:"מתרגלים את השיעורים האחרונים", en:"Practise the latest lessons", es:"Practica las últimas clases"},
    noEx:        {fr:"Pas encore d'exercices : ils arrivent après les prochains cours.", he:"עדיין אין תרגילים – הם יגיעו אחרי השיעורים הבאים.", en:"No exercises yet: they'll come after the next lessons.", es:"Aún no hay ejercicios: llegarán después de las próximas clases."},
    questions:   {fr:"questions", he:"שאלות", en:"questions", es:"preguntas"},
    question:    {fr:"Question", he:"שאלה", en:"Question", es:"Pregunta"},
    check:       {fr:"Vérifier", he:"בדיקה", en:"Check", es:"Comprobar"},
    next:        {fr:"Suivant", he:"הבא", en:"Next", es:"Siguiente"},
    hint:        {fr:"💡 Indice", he:"💡 רמז", en:"💡 Hint", es:"💡 Pista"},
    yourAnswer:  {fr:"Ta réponse…", he:"התשובה שלך…", en:"Your answer…", es:"Tu respuesta…"},
    correct:     {fr:"Bravo ! 🎉", he:"!כל הכבוד 🎉", en:"Well done! 🎉", es:"¡Muy bien! 🎉"},
    wrong:       {fr:"Pas tout à fait. Réponse :", he:"לא בדיוק. התשובה:", en:"Not quite. Answer:", es:"Casi. Respuesta:"},
    finished:    {fr:"Terminé !", he:"!סיימת", en:"All done!", es:"¡Terminado!"},
    goodAnswers: {fr:"bonnes réponses", he:"תשובות נכונות", en:"correct answers", es:"respuestas correctas"},
    again:       {fr:"Recommencer", he:"שוב", en:"Try again", es:"Otra vez"},
    back:        {fr:"Retour", he:"חזרה", en:"Back", es:"Volver"},
    reviews:     {fr:"🔁 Révisions de la semaine", he:"🔁 חזרות השבוע", en:"🔁 This week's reviews", es:"🔁 Repasos de la semana"},
    latest:      {fr:"✏️ Derniers cours", he:"✏️ השיעורים האחרונים", en:"✏️ Latest lessons", es:"✏️ Últimas clases"},
    learned:     {fr:"📚 Ce qu'il a appris", he:"📚 מה למדנו", en:"📚 What was learned", es:"📚 Lo que aprendió"},
    learnedSub:  {fr:"Sujets des cours depuis le début du semestre, par matière", he:"נושאי השיעורים מתחילת המחצית, לפי מקצוע", en:"Lesson topics since the start of the term, by subject", es:"Temas de las clases desde el inicio del semestre, por materia"},
    topicsN:     {fr:"sujets", he:"נושאים", en:"topics", es:"temas"},
    usual:       {fr:"Horaire habituel", he:"מערכת קבועה", en:"Usual timetable", es:"Horario habitual"},
    markDone:    {fr:"Marquer comme fait", he:"סמן כבוצע", en:"Mark as done", es:"Marcar como hecho"},
  };

  const LANG_KEY = "devoirs.lang", PW_KEY = "devoirs.pw", DONE_KEY = "devoirs.done";
  const store = {
    get(k){ try { return localStorage.getItem(k); } catch { return null; } },
    set(k,v){ try { localStorage.setItem(k,v); } catch {} },
    del(k){ try { localStorage.removeItem(k); } catch {} },
  };
  const guessLang = () => {
    for (const l of (navigator.languages || [navigator.language || "fr"])) {
      const c = l.slice(0,2).toLowerCase();
      if (c === "iw") return "he";
      if (LANGS[c]) return c;
    }
    return "fr";
  };
  let lang = LANGS[store.get(LANG_KEY)] ? store.get(LANG_KEY) : guessLang();
  const t = k => (T[k] && (T[k][lang] ?? T[k].fr)) || k;
  const loc = () => LANGS[lang].locale;

  function applyLang(){
    const L = LANGS[lang];
    document.documentElement.lang = lang;
    document.documentElement.dir = L.dir;
    document.querySelectorAll("[data-t]").forEach(el => el.textContent = t(el.dataset.t));
    $("pw").placeholder = t("password");
    $("reload").title = t("reload"); $("reload").setAttribute("aria-label", t("reload"));
    document.querySelectorAll("select.lang").forEach(s => {
      s.innerHTML = Object.entries(LANGS).map(([k,v]) => `<option value="${k}" ${k===lang?"selected":""}>🌐 ${v.label}</option>`).join("");
    });
    if (data) render();
  }

  let data = null, filter = null, tab = "home", ttDay = null;
  const EX_KEY = "devoirs.ex";
  let exRes = JSON.parse(store.get(EX_KEY) || "{}");
  let play = null;   // {key, i, score, answered, picked, hint}
  let done = new Set(JSON.parse(store.get(DONE_KEY) || "[]"));
  const $ = id => document.getElementById(id);
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

  // ---------- déchiffrement ----------
  async function decrypt(blob, password){
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey(
      {name:"PBKDF2", salt:b64(blob.salt), iterations:blob.iter, hash:"SHA-256"},
      base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
    const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(blob.iv)}, key, b64(blob.ct));
    return JSON.parse(new TextDecoder().decode(pt));
  }
  async function load(password){
    const r = await fetch("data.enc.json?t=" + Date.now(), {cache:"no-store"});
    if (!r.ok) throw new Error("fetch");
    return decrypt(await r.json(), password);
  }
  async function unlock(password, silent){
    try {
      data = await load(password);
      data.items ||= []; data.lessons ||= [];
      store.set(PW_KEY, password);
      $("lock").classList.add("hidden");
      $("app").classList.remove("hidden");
      $("nav").classList.remove("hidden");
      render();
    } catch (e) {
      if (silent) { store.del(PW_KEY); return; }
      $("err").textContent = e.message === "fetch" ? t("noData") : t("wrongPw");
    }
  }

  // ---------- outils ----------
  const iso = d => d.toLocaleDateString("sv-SE");
  const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
  const parse = s => new Date(s + "T12:00:00");
  const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
  const fmtDay = s => cap(parse(s).toLocaleDateString(loc(), {weekday:"long", day:"numeric", month:"long"}));
  const fmtShort = s => cap(parse(s).toLocaleDateString(loc(), {weekday:"short", day:"numeric", month:"short"}));
  const color = s => { let h = 0; for (const c of s) h = (h*31 + c.charCodeAt(0)) % 360; return `hsl(${h} 62% 48%)`; };
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const sunday = d => addDays(d, -d.getDay());
  // Cours d'un jour : les vrais cours Webtop s'il y en a, sinon l'horaire habituel de ce jour de la semaine
  const weekly = () => data.weekly || [];
  const lessonsOn = day => {
    const real = data.lessons.filter(l => l.date === day);
    if (real.length) return real;
    const wd = parse(day).getDay();
    return weekly().filter(w => w.day === wd).map(w => ({...w, date: day, planned: true}));
  };
  const hwOn = day => data.items.filter(i => i.date === day);
  const schoolDays = () => {
    const days = new Set(data.lessons.map(l => l.date));
    if (weekly().length) {
      const wds = new Set(weekly().map(w => w.day)), sun = sunday(new Date());
      for (let i = 0; i < 14; i++) { const d = addDays(sun, i); if (wds.has(d.getDay())) days.add(iso(d)); }
    }
    return [...days].sort();
  };
  const nowHM = () => new Date().toTimeString().slice(0,5);

  // ---------- composants ----------
  function hwCard(it, showDate){
    const isDone = done.has(it.id);
    return `<div class="card ${isDone?"done":""}" style="--c:${color(it.subject)}" data-id="${it.id}">
      <div class="body">
        ${showDate ? `<div class="when">${fmtShort(it.date)}</div>` : ""}
        <div class="subj" dir="auto">${esc(it.subject)}</div>
        ${it.topic ? `<div class="teacher" dir="auto" style="margin-top:2px">📖 ${esc(it.topic)}</div>` : ""}
        <div class="content" dir="auto">${esc(it.content)}</div>
        ${it.teacher ? `<div class="teacher" dir="auto">${esc(it.teacher)}</div>` : ""}
      </div>
      <button class="check" aria-label="${t("markDone")}">✓</button>
    </div>`;
  }

  function lessonRow(l, isToday){
    const time = l.start ? `${l.start}${l.end ? "–" + l.end : ""}` : "";
    const meta = [time, l.teacher, l.room].filter(Boolean).map(x => `<bdi>${esc(x)}</bdi>`).join(" · ");
    const now = isToday && l.start && l.end && !l.cancelled && l.start <= nowHM() && nowHM() < l.end;
    return `<div class="lesson ${l.cancelled?"cancel":""} ${now?"now":""}" style="--c:${color(l.subject)}">
      <div class="h">${l.hour ?? "•"}</div>
      <div class="lb">
        <div class="ls"><bdi>${esc(l.subject)}</bdi>${l.cancelled ? `<span class="badge">${t("cancelled")}</span>` : ""}</div>
        ${meta ? `<div class="lm">${meta}</div>` : ""}
        ${l.topic ? `<div class="lm" dir="auto">📖 ${esc(l.topic)}</div>` : ""}
        ${l.note ? `<div class="ln" dir="auto">${esc(l.note)}</div>` : ""}
      </div>
      ${now ? `<span class="nowtag">${t("now")}</span>` : ""}
    </div>`;
  }

  const timetable = day => {
    const ls = lessonsOn(day);
    if (!ls.length) return `<div class="empty">${t("noLessons")}</div>`;
    return `<div class="tt">${ls.map(l => lessonRow(l, day === iso(new Date()))).join("")}</div>` +
           (ls[0].planned ? `<div class="sub" style="margin-top:6px">🗓️ ${t("usual")}</div>` : "");
  };

  const bag = day => {
    const subs = [...new Set(lessonsOn(day).filter(l => !l.cancelled).map(l => l.subject))];
    return subs.length ? `<div class="bag" title="${t("bag")}" aria-label="${t("bag")}">🎒 ${subs.map(s => `<span dir="auto">${esc(s)}</span>`).join("")}</div>` : "";
  };

  // ---------- vues ----------
  function viewHome(){
    const today = iso(new Date());
    const days = schoolDays();
    const next = days.find(d => d > today);
    const upcoming = data.items.filter(i => i.date >= today && (!next || i.date <= next) && !done.has(i.id));
    let h = `<div class="hero">${fmtDay(today)}</div>`;
    if (lessonsOn(today).length) h += `<section><h2 class="today">${t("today")}</h2>${timetable(today)}</section>`;
    else if (days.length) h += `<section><div class="empty">${t("noSchool")}</div></section>`;
    if (next) h += `<section><h2><span>${fmtDay(next)}</span><a data-go="tt" data-day="${next}">${t("details")}</a></h2>${bag(next)}${timetable(next)}</section>`;
    h += `<section><h2><span>${t("hwTodo")}</span><a data-go="hw">${t("seeAll")}</a></h2>` +
         (upcoming.length ? upcoming.map(i => hwCard(i, true)).join("") : `<div class="empty">${t("nothingToDo")}</div>`) +
         `</section>`;
    return h;
  }

  function viewTT(){
    const todayD = new Date(), today = iso(todayD);
    const days = schoolDays();
    if (!days.length) return `<div class="empty">${t("noTT")}</div>`;
    if (!ttDay) ttDay = days.find(d => d >= today) || days[days.length-1];
    const sun = sunday(parse(ttDay));
    const thisSun = iso(sunday(todayD)), nextSun = iso(addDays(sunday(todayD), 7));
    const week = [...Array(6)].map((_,i) => iso(addDays(sun, i)));
    let h = "";
    if (days.some(d => d >= nextSun)) h += `<div class="seg">
        <button data-week="${thisSun}" aria-pressed="${iso(sun)===thisSun}">${t("thisWeek")}</button>
        <button data-week="${nextSun}" aria-pressed="${iso(sun)===nextSun}">${t("nextWeek")}</button></div>`;
    h += `<div class="days">` + week.map(d => {
      const dd = parse(d);
      const wd = dd.toLocaleDateString(loc(), {weekday:"short"}).replace(/\.$/, "").replace(/^יום /, "");
      return `<button class="daybtn ${d===today?"is-today":""}" data-day="${d}" aria-pressed="${d===ttDay}">
        <small>${wd}</small><b>${dd.getDate()}</b></button>`;
    }).join("") + `</div>`;
    h += `<h2 class="${ttDay===today?"today":""}">${fmtDay(ttDay)}</h2>${bag(ttDay)}${timetable(ttDay)}`;
    const hw = hwOn(ttDay);
    if (hw.length) h += `<section><h2>${t("hwOfDay")}</h2>${hw.map(i => hwCard(i)).join("")}</section>`;
    return h;
  }

  function group(title, items, cls="", dayless=false){
    if (!items.length) return "";
    const byDay = {};
    items.forEach(i => (byDay[i.date] ||= []).push(i));
    const days = Object.keys(byDay).sort();
    const showDay = days.length > 1 || !dayless;
    return `<section>${title ? `<h2 class="${cls}">${title}</h2>` : ""}` + days.map(d =>
      (showDay ? `<div class="day">${fmtDay(d)}</div>` : "") + byDay[d].map(i => hwCard(i)).join("")
    ).join("") + `</section>`;
  }

  function viewHW(){
    const subjects = [...new Set(data.items.map(i => i.subject))].sort();
    let h = subjects.length > 1
      ? `<div class="chips">` + [`<button class="chip" aria-pressed="${!filter}" data-s="">${t("all")}</button>`]
          .concat(subjects.map(s => `<button class="chip" dir="auto" aria-pressed="${filter===s}" data-s="${esc(s)}">${esc(s)}</button>`)).join("") + `</div>`
      : "";
    const items = data.items.filter(i => !filter || i.subject === filter);
    const now = new Date(), t0 = iso(now), t1 = iso(addDays(now,1)), t7 = iso(addDays(now,7));
    const parts = [
      group(t("today"), items.filter(i => i.date === t0), "today", true),
      group(t("tomorrow"), items.filter(i => i.date === t1), "", true),
      group(t("thisWeek"), items.filter(i => i.date > t1 && i.date <= t7)),
      group(t("later"), items.filter(i => i.date > t7)),
    ].join("");
    h += parts || `<div class="empty">${t("noneUpcoming")}</div>`;
    const past = items.filter(i => i.date < t0).reverse();
    if (past.length) h += `<details><summary>${t("previous")} (${past.length})</summary>${group("", past)}</details>`;
    return h;
  }

  // ---------- exercices ----------
  const SUBJ_ICONS = [["חשבון","🔢"],["מתמטיקה","🔢"],["עברית","📝"],["לשון","📝"],["אנגלית","🇬🇧"],["מדע","🔬"],
                      ["תורה","📜"],["תנ\"ך","📜"],["מולדת","🗺️"],["גאוגרפיה","🗺️"],["היסטוריה","🏛️"]];
  const subjIcon = s => (SUBJ_ICONS.find(([k]) => s.includes(k)) || [0,"✏️"])[1];
  const norm = s => String(s ?? "").toLowerCase().replace(/[\u0591-\u05C7]/g, "")
      .replace(/[\s.,!?'"׳״\-–:;()]/g, "").replace(/^ה(?=\S{2,})/, "");
  const isRight = (ex, val) => {
    const ok = [ex.answer, ...(ex.accept || [])].map(norm);
    return ok.includes(norm(val)) || (norm(val) !== "" && ok.some(a => a.replace(/^ה/, "") === norm(val)));
  };
  // Expressions mathématiques toujours lues de gauche à droite, même dans un texte en hébreu
  const mathEsc = s => esc(s).replace(/[\d(][\d\s+\-−–×x*÷/:=.,()?_]*[\d)_]/g,
      m => /[+\-−–×*÷/:=]/.test(m) ? `<span dir="ltr" style="unicode-bidi:isolate">${m}</span>` : m);
  const sets = () => (data.exercises || []).filter(s => s.exercises && s.exercises.length);
  const stars = (sc, n) => "⭐".repeat(Math.max(1, Math.round(3 * sc / n))) + "☆".repeat(3 - Math.max(1, Math.round(3 * sc / n)));

  function setCard(s){
    const r = exRes[s.key];
    const meta = s.kind === "review" && s.topics && s.topics.length
      ? `<bdi>${esc(s.subject)}</bdi> · <bdi>${s.topics.slice(0, 3).map(esc).join(", ")}${s.topics.length > 3 ? "…" : ""}</bdi>`
      : `<bdi>${esc(s.subject)}</bdi> · ${s.exercises.length} ${t("questions")}`;
    return `<div class="card" style="--c:${color(s.subject)}">
      <button class="set" data-set="${s.key}" style="background:none;border:0;padding:0">
        <span class="ico">${s.kind === "review" ? "🔁" : subjIcon(s.subject)}</span>
        <span style="flex:1;min-width:0">
          <div class="subj" dir="auto">${esc(s.title || s.subject)}</div>
          <div class="meta">${meta}</div>
        </span>
        ${r ? `<span class="res">${stars(r.score, r.total)}</span>` : `<span style="font-size:22px">▶</span>`}
      </button></div>`;
  }

  function learnedView(){
    const bySubj = {};
    data.lessons.filter(l => l.topic && !l.cancelled && l.date <= iso(new Date())).forEach(l => {
      const arr = (bySubj[l.subject] ||= []);
      if (!arr.some(x => x.topic === l.topic)) arr.push(l);
    });
    const subjects = Object.keys(bySubj).sort((a, b) => bySubj[b].length - bySubj[a].length);
    if (!subjects.length) return "";
    return `<section class="learn"><h2>${t("learned")}</h2><div class="sub" style="margin:-6px 0 10px">${t("learnedSub")}</div>` +
      subjects.map(s => {
        const items = bySubj[s].sort((a, b) => b.date.localeCompare(a.date));
        return `<details><summary><span dir="auto">${subjIcon(s)} ${esc(s)}</span><span class="meta" style="font-weight:400;color:var(--muted)">${items.length} ${t("topicsN")}</span></summary>
          <ul dir="auto">${items.map(l => `<li><bdi>${esc(l.topic)}</bdi> <small>· ${fmtShort(l.date)}</small></li>`).join("")}</ul></details>`;
      }).join("") + `</section>`;
  }

  function viewEx(){
    if (play) return viewPlayer();
    const list = sets();
    const reviews = list.filter(s => s.kind === "review");
    const daily = list.filter(s => s.kind !== "review");
    let h = "";
    if (!list.length) h += `<div class="empty">${t("noEx")}</div>`;
    if (reviews.length) h += `<section style="margin-top:0"><h2>${t("reviews")}</h2>${reviews.map(setCard).join("")}</section>`;
    if (daily.length) {
      h += `<section><h2>${t("latest")}</h2>`;
      const byDay = {};
      daily.forEach(s => (byDay[s.date] ||= []).push(s));
      Object.keys(byDay).sort().reverse().forEach(d => {
        h += `<div class="day">${fmtDay(d)}</div>` + byDay[d].map(setCard).join("");
      });
      h += `</section>`;
    }
    return h + learnedView();
  }

  function viewPlayer(){
    const s = sets().find(x => x.key === play.key);
    if (!s) { play = null; return viewEx(); }
    const n = s.exercises.length;
    if (play.i >= n) {
      return `<div class="qcard end">
        <div class="stars" dir="ltr">${stars(play.score, n)}</div>
        <div class="big">${t("finished")}</div>
        <div class="sub" style="font-size:16px">${play.score} / ${n} ${t("goodAnswers")}</div>
        <div class="act"><button class="ghost" data-exback>${t("back")}</button><button class="primary" data-exagain>${t("again")}</button></div>
      </div>`;
    }
    const ex = s.exercises[play.i];
    const done = play.answered;
    let body = "";
    if (ex.type === "choice") {
      body = `<div class="opts" dir="auto">` + ex.choices.map((c, k) => {
        let cls = "";
        if (done) cls = c === ex.answer ? "good" : (k === play.picked ? "bad" : "");
        return `<button class="opt ${cls}" data-opt="${k}" dir="auto" ${done ? "disabled" : ""}>${mathEsc(c)}</button>`;
      }).join("") + `</div>`;
    } else {
      body = `<input class="ans" id="ans" dir="auto" autocomplete="off" placeholder="${t("yourAnswer")}" ${done ? "disabled" : ""} value="${esc(play.typed || "")}">`;
    }
    const fb = done ? `<div class="fb ${play.right ? "good" : "bad"}" dir="auto">
        <b>${play.right ? t("correct") : `${t("wrong")} <bdi>${mathEsc(ex.answer)}</bdi>`}</b>${mathEsc(ex.explain || "")}</div>` : "";
    const hint = !done && play.hint && ex.hint ? `<div class="hintbox" dir="auto">💡 ${mathEsc(ex.hint)}</div>` : "";
    const actions = done
      ? `<button class="primary" data-exnext>${t("next")}</button>`
      : `${ex.hint && !play.hint ? `<button class="ghost" data-exhint>${t("hint")}</button>` : ""}` +
        (ex.type === "input" ? `<button class="primary" data-excheck>${t("check")}</button>` : "");
    return `<div class="player">
      <div class="top"><button class="btn" data-exback aria-label="${t("back")}">✕</button>
        <div class="bar"><i style="width:${Math.round(100 * play.i / n)}%"></i></div></div>
      <div class="qcard" style="--c:${color(s.subject)}">
        <div class="qnum">${t("question")} ${play.i + 1}/${n} · <bdi>${esc(s.subject)}</bdi></div>
        <div class="q" dir="auto">${mathEsc(ex.q)}</div>
        ${body}${hint}${fb}
        <div class="act">${actions}</div>
      </div></div>`;
  }

  function answer(val, picked){
    const s = sets().find(x => x.key === play.key), ex = s.exercises[play.i];
    play.answered = true; play.picked = picked; play.typed = val;
    play.right = isRight(ex, val);
    if (play.right) play.score++;
    render();
  }

  function render(){
    const name = data.student || "";
    $("title").textContent = name || t("school");
    document.title = name ? `🎒 ${name}` : `🎒 ${t("school")}`;
    if (data.updated) {
      const u = new Date(data.updated);
      $("updated").textContent = `${t("updated")} ` + u.toLocaleString(loc(), {weekday:"short", day:"numeric", month:"short", hour:"2-digit", minute:"2-digit"});
    }
    const today = iso(new Date());
    const todo = data.items.filter(i => i.date >= today && !done.has(i.id)).length;
    $("hwCount").textContent = todo || ""; $("hwCount").className = todo ? "count" : "";
    document.querySelectorAll("nav button").forEach(b => b.setAttribute("aria-current", b.dataset.tab === tab ? "page" : "false"));
    $("view").innerHTML = (data.warning === "session_expired" && !play ? `<div class="warn">${t("expired")}</div>` : "")
      + (tab === "tt" ? viewTT() : tab === "hw" ? viewHW() : tab === "ex" ? viewEx() : viewHome());
    const inp = $("ans"); if (inp && !inp.disabled) inp.focus();
  }

  function go(tb, day){
    tab = tb; if (day) ttDay = day; play = null;
    try { history.replaceState(null, "", "#" + tb); } catch {}
    render(); window.scrollTo(0, 0);
  }

  // ---------- événements ----------
  document.querySelectorAll("select.lang").forEach(s => s.addEventListener("change", e => {
    lang = e.target.value; store.set(LANG_KEY, lang); applyLang();
  }));
  $("lockForm").addEventListener("submit", e => { e.preventDefault(); $("err").textContent = ""; unlock($("pw").value); });
  $("reload").addEventListener("click", () => { const p = store.get(PW_KEY); if (p) unlock(p); });
  $("nav").addEventListener("click", e => { const b = e.target.closest("button[data-tab]"); if (b) go(b.dataset.tab); });
  $("view").addEventListener("keydown", e => {
    if (e.key === "Enter" && e.target.id === "ans" && e.target.value.trim()) answer(e.target.value);
  });
  $("view").addEventListener("click", e => {
    const el = e.target;
    const link = el.closest("[data-go]"); if (link) return go(link.dataset.go, link.dataset.day);
    const chip = el.closest(".chip"); if (chip) { filter = chip.dataset.s || null; return render(); }
    const st = el.closest("[data-set]"); if (st) { play = {key: st.dataset.set, i: 0, score: 0}; window.scrollTo(0,0); return render(); }
    if (el.closest("[data-exback]")) { play = null; return render(); }
    if (el.closest("[data-exagain]")) { play = {key: play.key, i: 0, score: 0}; return render(); }
    if (el.closest("[data-exhint]")) { play.hint = true; return render(); }
    const opt = el.closest("[data-opt]"); if (opt && play && !play.answered) {
      const ex = sets().find(x => x.key === play.key).exercises[play.i];
      return answer(ex.choices[+opt.dataset.opt], +opt.dataset.opt);
    }
    if (el.closest("[data-excheck]")) { const v = ($("ans") || {}).value || ""; if (v.trim()) answer(v); return; }
    if (el.closest("[data-exnext]")) {
      const s = sets().find(x => x.key === play.key);
      play = {key: play.key, i: play.i + 1, score: play.score};
      if (play.i >= s.exercises.length) {
        const prev = exRes[play.key];
        if (!prev || play.score >= prev.score) exRes[play.key] = {score: play.score, total: s.exercises.length};
        store.set(EX_KEY, JSON.stringify(exRes));
      }
      return render();
    }
    const wk = el.closest("[data-week]"); if (wk) {
      const end = iso(addDays(parse(wk.dataset.week), 6));
      ttDay = schoolDays().find(d => d >= wk.dataset.week && d <= end) || wk.dataset.week; return render();
    }
    const day = el.closest(".daybtn"); if (day) { ttDay = day.dataset.day; return render(); }
    const chk = el.closest(".check"); if (chk) {
      const id = chk.closest(".card").dataset.id;
      done.has(id) ? done.delete(id) : done.add(id);
      store.set(DONE_KEY, JSON.stringify([...done]));
      return render();
    }
  });

  const hash = location.hash.slice(1);
  if (["home","tt","hw","ex"].includes(hash)) tab = hash;
  applyLang();
  const saved = store.get(PW_KEY);
  if (saved) unlock(saved, true);
})();
</script>
</body>
</html>
